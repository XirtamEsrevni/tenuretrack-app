name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.0.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_version="$(node -p \"require('./package.json').version\")"
          expected_version="${RELEASE_TAG#v}"
          test "$package_version" = "$expected_version"

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Package production bundle
        run: tar -C dist -czf tenuretrack-${{ inputs.tag || github.ref_name }}.tar.gz .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "tenuretrack-${RELEASE_TAG}.tar.gz" \
            --generate-notes \
            --title "TenureTrack ${RELEASE_TAG}"
