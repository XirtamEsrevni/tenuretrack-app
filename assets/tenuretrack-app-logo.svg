<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img" aria-labelledby="title desc">
  <title id="title">tenuretrack App</title>
  <desc id="desc">The original tenuretrack logo with a red handwritten App label overlaid in its upper-right corner.</desc>
  <image href="https://github.com/sp8rks/tenuretrack/raw/main/src/tenuretrack/assets/tenuretrack-logo.png" width="680" height="240" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(510 90) rotate(-18)">
    <text
